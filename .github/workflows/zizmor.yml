# Audits every workflow and composite action under .github/ with zizmor
# whenever anything there changes, so the whole tree must stay clean, not only
# the files a change touches.
#
# Only High-severity findings are reported; each fails the job and is written
# as an annotation on the file it is in. Lower severities are filtered out, and
# are seen only by running zizmor locally. A finding that is accepted is
# suppressed where it occurs, with a `# zizmor: ignore[<audit>]` comment that
# gives the reason.
#
# zizmor is pinned to an exact release so that a new audit in a later release
# cannot fail an unrelated change; raising the pin is a change of its own. The
# pin fixes the audits, not the data the online ones read:
# known-vulnerable-actions consults the GitHub Advisory Database, so a new
# high or critical advisory against an action pinned under .github/ fails the
# next run without any change there. The weekly run reports such an advisory
# on main, before it fails a change that did not introduce it.
#
# The paths filter means the check does not report on a pull request that
# changes nothing under .github/, so it must stay out of the required checks:
# a required check that never reports leaves those pull requests waiting.
name: zizmor

on:
  pull_request:
    paths:
      - ".github/**"
  push:
    branches:
      - main
    paths:
      - ".github/**"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  # A pull request's runs share its ref, and a superseded one is cancelled.
  # Every other run is grouped by its commit, so no commit on main has its run
  # cancelled or replaced by a later commit's.
  group: zizmor-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Checkout only. The online audits read public repositories, which need
      # no grant on this token.
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # The audited set matches the trigger paths: everything under .github.
          inputs: .github
          version: 1.31.1
          min-severity: high
          # Annotations need no code scanning; the two modes are exclusive.
          advanced-security: false
          annotations: true
